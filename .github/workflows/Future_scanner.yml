name: Futures Confluence Engine

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs every 15 minutes on candle close
  workflow_dispatch:        # Allows manual run from GitHub UI

permissions:
  contents: write

jobs:
  analyze-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Futures Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python futures_engine.py

      - name: Save Journal History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add futures_log.csv
          git diff --staged --quiet || (git commit -m "chore: update futures signals [skip ci]" && git push)
